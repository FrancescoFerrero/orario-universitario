<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag fondamentale per evitare zoom indesiderati su iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orario Universitario</title>

    <!-- FullCalendar v6 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <style>
        :root {
            --sfondo-pagina: #f5f5f7;
            --sfondo-card: #ffffff;
            --testo-principale: #1d1d1f;
            --colore-accento: #007aff; /* Blu iOS */
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--sfondo-pagina);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: var(--testo-principale);
            -webkit-font-smoothing: antialiased;
        }

        /* Contenitore principale stile "Card" Apple */
        #contenitore-app {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--sfondo-card);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 16px;
            /* Permette a FullCalendar di scorrere orizzontalmente se necessario su schermi molto stretti */
            overflow-x: auto; 
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Ottimizzazioni UI per FullCalendar su mobile */
        .fc {
            font-size: 13px;
        }
        .fc-toolbar-title {
            font-size: 18px !important;
            font-weight: 600;
        }
        .fc .fc-button-primary {
            background-color: var(--colore-accento) !important;
            border-color: var(--colore-accento) !important;
            border-radius: 8px !important;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div id="contenitore-app">
        <h1>Il Mio Orario</h1>
        <!-- Il calendario verrà iniettato qui da JavaScript -->
        <div id="calendario"></div>
    </div>

    <script>
            // ==========================================
            // CONFIGURAZIONE UTENTE
            // ==========================================

            // 1. Inserisci l'URL dell'API della tua università (sostituisci questo di esempio)
            const urlAPIUniversita = 'https://unito.prod.up.cineca.it/api/Impegni/getImpegniCalendarioPubblico';

            // 2. Codifichiamo l'URL e lo uniamo al proxy CORS
            const urlConProxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(urlAPIUniversita)}`;

            // 3. Scrivi qui i nomi delle materie che vuoi visualizzare
            const materieScelte = [
                "LFT - LINGUAGGI E FORMALI E TRADUTTORI",
                "Reti & Sic A - RETI E SICUREZZA DELLE RETI",
                "Eginn - ECONOMIA E GESTIONE DELLE TECNOLOGIE"
            ];

            // ==========================================
            // LOGICA DI FETCH E FILTRAGGIO
            // ==========================================

            async function ottieniEventi() {
                try {
                    // Leggiamo il file JSON locale
                    const response = await fetch('./orario.json');
                    if (!response.ok) throw new Error('Errore nella lettura del file locale');
                    
                    const datiOrario = await response.json();
                    
                    const arrayLezioni = datiOrario.lezioni || datiOrario; 
                    
                    // Filtriamo e formattiamo i dati con i nomi corretti dell'API di UniTo
                    const eventiFormattati = arrayLezioni
                        .filter(lezione => {
                            // Controllo di sicurezza: se manca il nome, la scartiamo per evitare crash
                            if (!lezione.nome) return false; 
                            
                            // Mantiene solo le lezioni incluse in materieScelte
                            return materieScelte.some(materia => 
                                lezione.nome.toLowerCase().includes(materia.toLowerCase())
                            );
                        })
                        .map(lezione => {
                            // Estraiamo l'aula dall'array "aule"
                            let nomeAula = "";
                            if (lezione.aule && lezione.aule.length > 0) {
                                nomeAula = ` - ${lezione.aule[0].des || lezione.aule[0].descrizione || "Aula non definita"}`;
                            }

                            // Creiamo l'oggetto per FullCalendar
                            return {
                                title: `${lezione.nome}${nomeAula}`,
                                start: lezione.dataInizio, 
                                end: lezione.dataFine
                            };
                        });

                    return eventiFormattati;

                } catch (errore) {
                    console.error("Errore nel fetch dell'orario:", errore);
                    document.getElementById('calendario').innerHTML = 
                        '<p style="text-align:center; color:#ff3b30; padding: 20px;">Impossibile caricare l\'orario.</p>';
                    return [];
                }
                                        }



        // ==========================================
        // INIZIALIZZAZIONE CALENDARIO
        // ==========================================

        document.addEventListener('DOMContentLoaded', function() {
            const elementoCalendario = document.getElementById('calendario');

            const calendario = new FullCalendar.Calendar(elementoCalendario, {
                // Partiamo con la vista settimanale
                initialView: 'timeGridWeek',
                
                // Nascondiamo i weekend per recuperare spazio prezioso su mobile
                weekends: false, 
                
                // Impostiamo gli orari tipici delle lezioni (es. 08:00 - 20:00)
                slotMinTime: '08:00:00',
                slotMaxTime: '20:00:00',
                
                // Rimuoviamo la riga "tutto il giorno" (inutile per lezioni a orario)
                allDaySlot: false,
                
                // Altezza automatica per scorrere la pagina in modo nativo su iPhone
                height: 'auto',
                
                // Barra degli strumenti minimalista
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today' 
                },

                // Personalizzazione del testo dei pulsanti
                buttonText: {
                    today: 'Oggi'
                },
                
                // Colleghiamo i dati: FullCalendar chiamerà la nostra funzione!
                events: async function(info, successCallback, failureCallback) {
                    // Chiamiamo la funzione creata nel Passo 2
                    const eventi = await ottieniEventi();
                    
                    if (eventi.length > 0) {
                        // Passiamo gli eventi al calendario
                        successCallback(eventi);
                    } else {
                        // Se c'è un errore o nessun evento, passiamo un array vuoto
                        failureCallback();
                    }
                },

                // Stile degli eventi (blu iOS)
                eventColor: 'var(--colore-accento)',
                eventTextColor: '#ffffff',
                eventBorderColor: 'transparent',
            });

            calendario.render();
        });
    </script>
</body>
</html>
