<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag fondamentale per evitare zoom indesiderati su iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orario Universitario</title>

    <!-- FullCalendar v6 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <!-- Plugin per il formato iCal -->
    <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>

    <style>
        :root {
            --sfondo-pagina: #f5f5f7;
            --sfondo-card: #ffffff;
            --testo-principale: #1d1d1f;
            --colore-accento: #007aff; /* Blu iOS */
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--sfondo-pagina);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, sans-serif;
            color: var(--testo-principale);
            -webkit-font-smoothing: antialiased;
        }

        /* Contenitore principale stile "Card" Apple */
        #contenitore-app {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--sfondo-card);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 16px;
            /* Permette a FullCalendar di scorrere orizzontalmente se necessario su schermi molto stretti */
            overflow-x: auto; 
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-top: 8px;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Ottimizzazioni UI per FullCalendar su mobile */
        .fc {
            font-size: 13px;
        }
        .fc-toolbar-title {
            font-size: 18px !important;
            font-weight: 600;
        }
        .fc .fc-button-primary {
            background-color: var(--colore-accento) !important;
            border-color: var(--colore-accento) !important;
            border-radius: 8px !important;
            text-transform: capitalize;
        }
    </style>
</head>
<body>

    <div id="contenitore-app">
        <h1>Il Mio Orario</h1>
        <!-- Il calendario verrà iniettato qui da JavaScript -->
        <div id="calendario"></div>
    </div>

    <script>
            document.addEventListener('DOMContentLoaded', function() {
    // 1. INCOLLA QUI IL TUO LINK ICAL (.ics) FORNITO DALL'UNIVERSITÀ
    const linkICal = 'https://unito.prod.up.cineca.it:443/api/FiltriICal/impegniICal?id=6abacd7dc3623c00c6658078';
    
    // Rimuoviamo temporaneamente il proxy
    const urlConProxy = linkICal;

    const materieScelte = [
        "LFT - LINGUAGGI E FORMALI E TRADUTTORI",
        "Reti & Sic A - RETI E SICUREZZA DELLE RETI",
        "Eginn - ECONOMIA E GESTIONE DELLE TECNOLOGIE"
    ];

    const elementoCalendario = document.getElementById('calendario');

    const calendario = new FullCalendar.Calendar(elementoCalendario, {
        initialView: 'timeGridWeek',
        weekends: false, 
        slotMinTime: '08:00:00',
        slotMaxTime: '20:00:00',
        allDaySlot: false,
        height: 'auto',
        headerToolbar: {
            left: 'prev,next',
            center: 'title',
            right: 'today' 
        },
        buttonText: { today: 'Oggi' },
        eventColor: 'var(--colore-accento)',
        eventTextColor: '#ffffff',
        eventBorderColor: 'transparent',

        // Colleghiamo l'iCal tramite proxy
        events: {
            url: urlConProxy,
            format: 'ics'
        },

        // FILTRO: Nascondiamo visivamente le materie che non ci interessano
        eventDidMount: function(info) {
            const titoloEvento = info.event.title.toLowerCase();
            
            const daMostrare = materieScelte.some(materia => 
                titoloEvento.includes(materia.toLowerCase())
            );
            
            if (!daMostrare) {
                // Nasconde l'evento dalla griglia
                info.el.style.display = 'none'; 
            }
        },
        
        // Gestione errori
        eventSourceFailure: function() {
            document.getElementById('calendario').innerHTML = 
                '<p style="text-align:center; color:#ff3b30; padding: 20px;">Impossibile caricare l\'iCal.</p>';
        }
    });

    calendario.render();
});
    </script>
</body>
</html>
