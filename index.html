<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Orario Universitario</title>

    <!-- FullCalendar v6 CDN e Lingua Italiana -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.10/locales/it.global.min.js"></script>
    <!-- Plugin per leggere il file iCal (.ics) -->
    <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.10/index.global.min.js"></script>

    <style>
        :root {
            --bg-body: #F2F2F7;
            --bg-card: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --accent-blue: #007AFF;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        /* --- Ottimizzazione Layout iPhone 16 (Safe Areas) --- */
        body {
            margin: 0;
            padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 24px) 16px;
            background-color: var(--bg-body);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        #app-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-card);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 16px;
            overflow-x: auto;
        }

        /* UI FullCalendar */
        .fc { font-size: 13px; }
        
        .fc-toolbar-title { 
            font-size: 22px !important; 
            font-weight: 700; 
            letter-spacing: -0.5px;
            text-transform: capitalize; 
            padding-top: 8px;
        }

        /* --- Ergonomia Bottoni Bottom Navigation --- */
        .fc .fc-button-primary {
            background-color: #F2F2F7 !important;
            color: var(--accent-blue) !important;
            border: none !important;
            font-weight: 600 !important;
            text-transform: capitalize;
            padding: 12px 20px !important; 
            border-radius: 12px !important;
            transition: all 0.2s ease;
        }

        .fc .fc-button-primary:hover {
            background-color: #E5E5EA !important;
        }

        .fc .fc-button-primary:active {
            transform: scale(0.92);
            background-color: #D1D1D6 !important;
        }

        .fc-button-group {
            background-color: #F2F2F7;
            border-radius: 14px;
            padding: 3px;
        }
        
        .fc-button-group .fc-button-primary {
            background-color: transparent !important;
            border-radius: 10px !important;
            margin: 0 2px !important;
        }

        .fc .fc-button-primary:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }
        
        /* Fix Margine inferiore per la toolbar in basso */
        .fc-footer-toolbar {
            margin-top: 24px !important;
            padding-bottom: 8px;
        }
        
        /* --- FIX LARGHEZZA EVENTI --- */
        .fc-timegrid-event-harness {
            right: 0 !important; 
        }

        .fc-v-event {
            border-radius: 8px;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.1s ease;
            width: 100% !important;
        }
        .fc-v-event:active { transform: scale(0.96); }

        /* --- FINESTRA MODALE (POPUP STILE iOS) --- */
        #modal-sfondo {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #modal-contenuto {
            background-color: var(--bg-card);
            margin: 25vh auto;
            padding: 24px;
            border-radius: 24px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #modal-sfondo.aperto { display: block; opacity: 1; }
        #modal-sfondo.aperto #modal-contenuto { transform: translateY(0); }

        .chiudi-modal {
            float: right;
            background: #F2F2F7;
            color: #8E8E93;
            width: 30px; height: 30px;
            border-radius: 15px;
            text-align: center;
            line-height: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .chiudi-modal:active { background: #E5E5EA; }

        #modal-titolo {
            font-size: 20px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 20px;
            padding-right: 36px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .modal-info { font-size: 15px; margin-bottom: 14px; }
        .modal-info span.label { font-weight: 600; display: block; color: var(--text-main); margin-bottom: 4px; }
        .modal-info span.valore { font-weight: 400; color: var(--text-muted); display: block; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="calendario"></div>
    </div>

    <!-- STRUTTURA DEL POPUP DETTAGLI -->
    <div id="modal-sfondo">
        <div id="modal-contenuto">
            <div class="chiudi-modal" id="btn-chiudi">&times;</div>
            <h2 id="modal-titolo">Titolo Materia</h2>
            
            <div class="modal-info">
                <span class="label">Orario:</span>
                <span class="valore" id="modal-orario"></span>
            </div>
            
            <div class="modal-info">
                <span class="label">Aula:</span>
                <span class="valore" id="modal-aula" style="color: var(--text-main); font-weight: 500;"></span>
            </div>

            <div class="modal-info">
                <span class="label">Docente:</span>
                <span class="valore" id="modal-docente"></span>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Link diretto all'iCal (nessun CORS proxy necessario)
        const linkICal = 'https://unito.prod.up.cineca.it:443/api/FiltriICal/impegniICal?id=6abacd7dc3623c00c6658078';
        
        const materieScelte = [
            "LFT - LINGUAGGI E FORMALI E TRADUTTORI",
            "Reti & Sic A - RETI E SICUREZZA DELLE RETI",
            "Eginn - ECONOMIA E GESTIONE DELLE TECNOLOGIE"
        ];

        // Colori in stile iOS
        const paletteColori = ['#FF9500', '#FF2D55', '#5856D6', '#34C759', '#32ADE6'];
        const elementoCalendario = document.getElementById('calendario');

        const calendario = new FullCalendar.Calendar(elementoCalendario, {
            locale: 'it',
            initialView: 'timeGridWeek',
            weekends: false, 
            slotMinTime: '08:00:00',
            slotMaxTime: '20:00:00',
            allDaySlot: false,
            height: 'auto',
            
            slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
            eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
            dayHeaderFormat: { weekday: 'short', day: 'numeric' },

            // NAVIGAZIONE IPHONE 16: Titolo in alto, bottoni in basso per il pollice
            headerToolbar: {
                left: '',
                center: 'title',
                right: '' 
            },
            footerToolbar: {
                left: 'prev,next',
                center: '',
                right: 'today'
            },

            events: {
                url: linkICal,
                format: 'ics'
            },

            eventDidMount: function(info) {
                const titoloEvento = info.event.title.toLowerCase();
                const indiceMateria = materieScelte.findIndex(materia => 
                    titoloEvento.includes(materia.toLowerCase())
                );
                
                if (indiceMateria === -1) {
                    info.el.style.display = 'none'; 
                } else {
                    const colore = paletteColori[indiceMateria % paletteColori.length];
                    info.el.style.backgroundColor = colore;
                    info.event.setProp('backgroundColor', colore);
                }
            },

            eventContent: function(info) {
                let titolo = info.event.title;
                
                // Estrae solo il nome dell'aula pulito
                let stringaAula = info.event.extendedProps.location || ''; 
                let aulaPura = stringaAula.split('-')[0].split(',')[0].trim();

                let contenitore = document.createElement('div');
                contenitore.style.display = 'flex';
                contenitore.style.flexDirection = 'column';
                contenitore.style.height = '100%'; 
                contenitore.style.padding = '4px 6px'; 
                contenitore.style.overflow = 'hidden';

                let elOrario = document.createElement('div');
                elOrario.innerText = info.timeText;
                elOrario.style.fontSize = '11px';
                elOrario.style.fontWeight = '500';
                elOrario.style.opacity = '0.9';

                let elTitolo = document.createElement('div');
                elTitolo.innerText = titolo;
                elTitolo.style.fontWeight = '600';
                elTitolo.style.fontSize = '12px';
                elTitolo.style.lineHeight = '1.2';
                elTitolo.style.marginTop = '2px';
                elTitolo.style.flexGrow = '1';

                let elAula = document.createElement('div');
                elAula.innerText = aulaPura; 
                elAula.style.fontSize = '12px';
                elAula.style.fontWeight = '600';
                elAula.style.marginTop = '4px';

                contenitore.appendChild(elOrario);
                contenitore.appendChild(elTitolo);
                if(aulaPura) contenitore.appendChild(elAula);

                return { domNodes: [contenitore] };
            },

            eventClick: function(info) {
                info.jsEvent.preventDefault();
                
                const opzioniOra = { hour: '2-digit', minute: '2-digit', hour12: false };
                const oraInizio = info.event.start.toLocaleTimeString('it-IT', opzioniOra);
                const oraFine = info.event.end ? info.event.end.toLocaleTimeString('it-IT', opzioniOra) : '';

                document.getElementById('modal-titolo').innerText = info.event.title;
                document.getElementById('modal-orario').innerText = `${oraInizio} - ${oraFine}`;
                
                let stringaAula = info.event.extendedProps.location || ''; 
                let aulaPura = stringaAula.split('-')[0].split(',')[0].trim();
                
                document.getElementById('modal-aula').innerText = aulaPura ? aulaPura : 'Aula non specificata';

                const docente = info.event.extendedProps.description;
                document.getElementById('modal-docente').innerText = docente ? docente : 'Nessun dettaglio extra';

                const modal = document.getElementById('modal-sfondo');
                modal.style.display = 'block';
                setTimeout(() => modal.classList.add('aperto'), 10);
            }
        });

        calendario.render();

        const modal = document.getElementById('modal-sfondo');
        const btnChiudi = document.getElementById('btn-chiudi');

        function chiudiModal() {
            modal.classList.remove('aperto');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        btnChiudi.addEventListener('click', chiudiModal);
        window.addEventListener('click', function(event) {
            if (event.target === modal) chiudiModal();
        });
    });
    </script>
</body>
</html>
